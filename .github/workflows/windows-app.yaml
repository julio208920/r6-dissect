name: Windows app

# Builds the Windows app with desktop/build.ps1, tests the installer on a real
# Windows machine (install, open the app window, uninstall), and attaches
# R6MatchStats-Setup.exe and R6MatchStats-Windows.zip to each published release,
# after a virus scan whose results (VirusScan.txt) are attached too.
# R6MatchStats-Setup.exe, R6MatchStats-Windows.zip and their SHA256SUMS.txt to each
# published release, after a Microsoft Defender scan.
# The website's download button points at the newest release that has them.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to update after tests and scans (blank builds artifacts only)
        required: false
        type: string
  push:
    paths:
      - "desktop/**"
      - "scripts/*.py"
      - "scripts/requirements.txt"
      - ".github/workflows/windows-app.yaml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      R6_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./desktop/build.ps1

      - name: Test statistics and pages
        shell: pwsh
        run: |
          python -m unittest discover -s scripts
          if ($LASTEXITCODE) { throw "Python tests failed" }
          go test ./...
          if ($LASTEXITCODE) { throw "Go tests failed" }

      - name: Virus scan and integrity checks
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: ./desktop/scan-release.ps1
      - name: Test
        shell: pwsh
        run: |
          python -m unittest discover -s scripts
          if ($LASTEXITCODE) { throw "app tests failed" }
          python -m unittest discover -s desktop
          if ($LASTEXITCODE) { throw "integrity tests failed" }
          python desktop\integrity.py verify dist\R6MatchStats
          if ($LASTEXITCODE) { throw "the built app doesn't match its own file list" }

      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp) -or -not (Get-MpComputerStatus -ErrorAction SilentlyContinue).AntivirusEnabled) {
            Write-Host "::warning::Microsoft Defender isn't running on this machine; skipping the scan"
            exit 0
          }
          & $mp -SignatureUpdate | Out-Host
          # exit codes don't tell a failed scan from a detection, so read the verdict line instead
          $out = (& $mp -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation) -join "`n"
          $out
          if ($out -match 'found no threats') { "No threats found." }
          elseif ($out -match 'found \d+ threat') { throw "Microsoft Defender flagged a file in the build; not publishing it" }
          else { Write-Host "::warning::The Defender scan didn't finish (exit code $LASTEXITCODE)" }
          exit 0

      - name: Install
        shell: pwsh
        run: |
          $setup = Start-Process dist\R6MatchStats-Setup.exe -WindowStyle Hidden -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/LOG=install.log'
          if ($setup.ExitCode) { Get-Content install.log; throw "installer exited with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\R6 Match Stats\R6MatchStats.exe"
          $startMenu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\R6 Match Stats.lnk"
          $desktop = "$([Environment]::GetFolderPath('Desktop'))\R6 Match Stats.lnk"
          foreach ($path in $app, $startMenu, $desktop) {
            if (-not (Test-Path $path)) { throw "missing after install: $path" }
          }
          $info = (Get-Item $app).VersionInfo
          "Installed $($info.ProductName) $($info.ProductVersion) to $app"

      - name: Open the app window
        shell: pwsh
        run: |
          $env:R6_SMOKE_TEST = "$PWD\smoke.json"
          $app = Start-Process "$env:LOCALAPPDATA\Programs\R6 Match Stats\R6MatchStats.exe" -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill($true); throw "the app didn't finish loading in 3 minutes" }
          if (Test-Path smoke.json) { Get-Content smoke.json }
          if ($app.ExitCode) {
            Get-Content "$env:LOCALAPPDATA\R6MatchStats\app.log" -ErrorAction SilentlyContinue
            throw "the app window didn't show the app (exit code $($app.ExitCode))"
          }
          Start-Sleep -Seconds 3
          $left = Get-Process R6MatchStats -ErrorAction SilentlyContinue
          if ($left) { throw "the app's server kept running after its window closed" }

      - name: Uninstall
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\R6 Match Stats"
          $un = Start-Process "$dir\unins000.exe" -WindowStyle Hidden -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($un.ExitCode) { throw "uninstaller exited with $($un.ExitCode)" }
          Start-Sleep -Seconds 3  # the uninstaller removes its own files from a helper process
          if (Test-Path "$dir\R6MatchStats.exe") { throw "the app is still there after uninstalling" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\R6 Match Stats.lnk") { throw "Start menu shortcut left behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: R6MatchStats-Windows
          path: |
            dist/R6MatchStats-Setup.exe
            dist/R6MatchStats-Windows.zip
            dist/VirusScan.txt
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            smoke.json
            smoke.json.png
            install.log
          if-no-files-found: ignore
      - name: Attach to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:R6_VERSION
          gh release upload $tag dist/R6MatchStats-Setup.exe dist/R6MatchStats-Windows.zip dist/VirusScan.txt dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE) { throw "uploading to the release failed" }
          # Replace stale scan notes when rebuilding an existing release.
          $notes = (gh release view $tag --json body --jq .body) -join "`n"
          if ($LASTEXITCODE) { throw "reading release notes failed" }
          $notes = ($notes -split '(?m)^## Virus scan')[0].TrimEnd()
          $scan = (Get-Content dist\VirusScan.txt) -join "`n"
          $fence = '```'
          @($notes, '', '## Virus scan', '', $fence, $scan, $fence) | Set-Content notes.md -Encoding utf8
          gh release edit $tag --notes-file notes.md
          if ($LASTEXITCODE) { throw "updating release notes failed" }
        run: gh release upload "${{ github.event.release.tag_name }}" dist/R6MatchStats-Setup.exe dist/R6MatchStats-Windows.zip dist/SHA256SUMS.txt --clobber
